<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Space City Cruise Collective</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap');
    :root{
      --navy:#0B1F3B;
      --teal:#0E7C86;
      --amber:#F59E0B;
      --bg:#F7F8FA;
      --text:#0F172A;
      --muted:#475569;
      --border:rgba(15,23,42,0.10);
      --shadow: 0 10px 30px rgba(2, 6, 23, 0.10);
      --radius:18px;
      --max: 1160px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background:var(--bg);
      line-height:1.45;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:20px;
    }
    .card{
      background:#fff;
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:48px 40px;
      text-align:center;
      max-width:520px;
      width:100%;
    }
    .icon{
      width:64px; height:64px;
      border-radius:50%;
      background:rgba(14,124,134,0.10);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:32px;
      margin:0 auto 20px;
    }
    h1{
      font-family: Montserrat, Inter, sans-serif;
      font-size:28px;
      margin:0 0 12px;
      color:var(--navy);
    }
    p{
      color:var(--muted);
      font-size:16px;
      margin:0 0 24px;
      line-height:1.6;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:12px 24px;
      border-radius:14px;
      border:1px solid rgba(0,0,0,0.08);
      background:var(--amber);
      font-weight:700;
      font-size:14px;
      cursor:pointer;
      color:#1A1200;
      text-decoration:none;
      transition:transform 0.05s ease, box-shadow 0.2s ease;
    }
    .btn:hover{box-shadow:var(--shadow); transform:translateY(-1px)}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#10003;</div>
    <h1>Quote Request Received</h1>
    <p>Thank you for reaching out to Space City Cruise Collective. Our dispatch team has received your quote request and will follow up shortly. A confirmation email has been sent to the address you provided.</p>
    <a href="/" class="btn">Back to Home</a>
  </div>
</body>
</html>
