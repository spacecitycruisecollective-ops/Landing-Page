<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Space City Cruise Collective</title>

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/images/android-chrome-192x192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/images/android-chrome-512x512.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap');
    :root{
      --color-black: #000000;
      --color-charcoal: #111111;
      --color-amber: #F5A623;
      --color-amber-soft: #FFF4E5;
      --color-white: #FFFFFF;
      --color-text-primary: #111827;
      --color-text-secondary: #6B7280;
      --color-bg-alt: #F5F7FA;
      --color-border: #E5E7EB;
      --color-card-bg: #FFFFFF;
      --color-btn-primary-bg: #F5A623;
      --color-btn-primary-text: #000000;
      --color-btn-primary-hover: #D98C1A;
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 10px 24px rgba(0, 0, 0, 0.12);
      --radius-lg: 18px;
      --radius-md: 14px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--color-text-primary);
      background:var(--color-bg-alt);
      line-height:1.45;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:20px;
    }
    .card{
      background:var(--color-card-bg);
      border:1px solid var(--color-border);
      border-radius:var(--radius-lg);
      box-shadow:var(--shadow-lg);
      padding:48px 40px;
      text-align:center;
      max-width:520px;
      width:100%;
    }
    .icon{
      width:64px; height:64px;
      border-radius:50%;
      background:var(--color-amber-soft);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:32px;
      margin:0 auto 20px;
    }
    h1{
      font-family: Montserrat, Inter, sans-serif;
      font-size:28px;
      margin:0 0 12px;
      color:var(--color-text-primary);
    }
    p{
      color:var(--color-text-secondary);
      font-size:16px;
      margin:0 0 24px;
      line-height:1.6;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:12px 24px;
      border-radius:var(--radius-md);
      border:1px solid rgba(0,0,0,0.08);
      background:var(--color-btn-primary-bg);
      font-weight:700;
      font-size:14px;
      cursor:pointer;
      color:var(--color-btn-primary-text);
      text-decoration:none;
      transition:transform 0.05s ease, box-shadow 0.2s ease;
    }
    .btn:hover{box-shadow:var(--shadow-md); transform:translateY(-1px)}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#10003;</div>
    <h1>Quote Request Received</h1>
    <p>Thank you for reaching out to Space City Cruise Collective. Our dispatch team has received your quote request and will follow up shortly. A confirmation email has been sent to the address you provided.</p>
    <a href="/" class="btn">Back to Home</a>
  </div>
</body>
</html>
